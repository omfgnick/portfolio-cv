<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Página não encontrada — Nicolas Mesquita Fernandes</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{ color-scheme: light dark; }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:#f3f2ef; color:#0f172a; padding:24px; text-align:center;
    }
    @media (prefers-color-scheme: dark){
      body{ background:#0b1220; color:rgba(255,255,255,.92); }
    }
    .card{ max-width:520px; }
    .code{ font-size:64px; font-weight:900; letter-spacing:1px; color:#0a66c2; margin:0; }
    h1{ font-size:20px; margin:8px 0 6px; }
    p{ margin:0 0 20px; line-height:1.6; opacity:.85; }
    a.btn{
      display:inline-block; text-decoration:none; font-weight:700; font-size:14px;
      padding:12px 18px; border-radius:999px; background:#0a66c2; color:#fff;
    }
    a.btn:hover{ background:#0b5cae; }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe neste site.</p>
    <a class="btn" href="/portfolio-cv/">Voltar ao perfil</a>
  </div>
</body>
</html>
